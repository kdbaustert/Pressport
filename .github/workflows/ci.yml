name: CI

on:
  push:
    # Tags are tested by the release workflow, which calls this one before it builds.
    branches: ['**']
  pull_request:
  workflow_call:

concurrency:
  # github.workflow is the caller's name when called, so a release run never cancels a branch run.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - uses: ramsey/composer-install@v3

      - name: PHPCS (WordPress Coding Standards, PHP 7.4+ compatibility)
        run: vendor/bin/phpcs

  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lowest supported (readme: Requires PHP 7.4) up to current.
        php: ['7.4', '8.1', '8.3', '8.4']

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: pressport_tests
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v3

      - name: Syntax check
        run: composer lint

      - name: PHPUnit
        run: vendor/bin/phpunit
        env:
          WP_TESTS_DB_HOST: 127.0.0.1:3306
          WP_TESTS_DB_NAME: pressport_tests
          WP_TESTS_DB_USER: root
          WP_TESTS_DB_PASSWORD: root
